services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro  # different nginx config for dev

  backend:
    command: uv run flask run --host=0.0.0.0 --port=5000 --debug
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_APP=api_server.py  # change to your main file
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend:/app  # hot reload
      - ./secrets/credentials.json:/run/secrets/credentials.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev 
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_API_URL=/api
    volumes:
      - ./frontend/src:/app/src
    expose:
      - "5173"